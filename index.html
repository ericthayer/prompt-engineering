<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>threejs</title>
    <!-- Critical CSS: Handled manually for instant first paint -->
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0a0a0a;
          --text-color: #f5f5f5;
        }
      }
      body {
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
      #root:empty::after {
        content: "Initializing Scene...";
        font-weight: 500;
        letter-spacing: 0.05em;
        opacity: 0.8;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root" role="status" aria-live="polite" aria-label="Application loading"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
